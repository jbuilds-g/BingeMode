name: Android CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build BingeMode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key-2.jks

      - name: Run unit tests
        run: gradle test

      - name: Build release-signed APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key-2.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify release APKs
        run: |
          echo "Release APKs:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort

          expected=(
            "app/build/outputs/apk/release/app-universal-release.apk"
            "app/build/outputs/apk/release/app-armeabi-v7a-release.apk"
            "app/build/outputs/apk/release/app-arm64-v8a-release.apk"
            "app/build/outputs/apk/release/app-x86-release.apk"
            "app/build/outputs/apk/release/app-x86_64-release.apk"
          )

          for apk in "${expected[@]}"; do
            test -f "$apk" || { echo "Missing expected APK: $apk"; exit 1; }
          done

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: BingeMode-universal
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: BingeMode-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: BingeMode-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: BingeMode-x86
          path: app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: BingeMode-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f my-upload-key-2.jks
