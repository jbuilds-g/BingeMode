name: Android CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build BingeMode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key-2.jks

      - name: Build release-signed APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key-2.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: BingeMode-release
          path: app/build/outputs/apk/release/*.apk

      - name: Remove release keystore
        if: always()
        run: rm -f my-upload-key-2.jks
